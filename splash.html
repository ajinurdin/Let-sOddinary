<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animasi Full-Icon ke Full-Logo (Let's Oddinary)</title>
  <style>
    :root {
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.65, 0, 0.35, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      padding: 20px;
    }

    /* Panel Tombol Kontrol Demo */
    .controls {
      display: flex;
      gap: 10px;
      background: #1e293b;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #334155;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: #e2e8f0;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background: #475569;
    }

    button.active {
      background: #F0B70D;
      color: #0f172a;
    }

    .caption {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
    }

    /* ==========================================================
       CONTAINER UTAMA LOGO (375x375 sesuai SVG asli)
       ========================================================== */
    .logo-container {
      width: 375px;
      height: 375px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55);
      transition: transform 0.3s var(--ease-spring);
    }

    .logo-container:hover {
      transform: scale(1.02);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Mengatur referensi titik transformasi per-elemen SVG */
    .anchor-L,
    .anchor-O,
    .star-inside-O,
    .char-item {
      transform-box: fill-box;
    }

    /* ==========================================================
       STATE AWAL: FULL-ICON (Frame 6 - "LO")
       Dihitung langsung dari rasio path Full-Icon / Full-Logo:
       - L: dari (97, 42) [56x89] -> ke (96, 53) [168.559x267.888]
       - O: dari (97, 138) [46x94] -> ke (186.908, 53) [92.092x188.188]
       ========================================================== */
    .anchor-L {
      transform-origin: top left;
      transform: translate(-1px, 11px) scale(3.01, 3.01);
      transition: transform 0.7s var(--ease-smooth);
    }

    .anchor-O {
      transform-origin: top left;
      transform: translate(89.908px, -85px) scale(2.002, 2.002);
      transition: transform 0.7s var(--ease-smooth);
    }

    .star-inside-O {
      transform-origin: center;
      transition: transform 0.85s var(--ease-spring);
    }

    /* Semua huruf selain L dan O disembunyikan saat kondisi Full-Icon */
    .char-item {
      opacity: 0;
      transform-origin: center;
      transform: translateY(14px) scale(0.55);
      transition: 
        opacity 0.35s ease,
        transform 0.55s var(--ease-spring);
    }

    /* ==========================================================
       STATE AKHIR: FULL-LOGO (Frame 5 - "LET'S ODDINARY")
       Aktif ketika di-hover atau diklik (.is-expanded)
       ========================================================== */
    .logo-container.mode-interactive:hover .anchor-L,
    .logo-container.is-expanded .anchor-L {
      transform: translate(0, 0) scale(1, 1);
    }

    .logo-container.mode-interactive:hover .anchor-O,
    .logo-container.is-expanded .anchor-O {
      transform: translate(0, 0) scale(1, 1);
    }

    .logo-container.mode-interactive:hover .star-inside-O,
    .logo-container.is-expanded .star-inside-O {
      transform: rotate(180deg);
    }

    .logo-container.mode-interactive:hover .char-item,
    .logo-container.is-expanded .char-item {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Efek Kemunculan Berurutan (Staggered Animation) */
    .logo-container.mode-interactive:hover .step-1,
    .logo-container.is-expanded .step-1 { transition-delay: 0.18s; }

    .logo-container.mode-interactive:hover .step-2,
    .logo-container.is-expanded .step-2 { transition-delay: 0.25s; }

    .logo-container.mode-interactive:hover .step-3,
    .logo-container.is-expanded .step-3 { transition-delay: 0.32s; }

    .logo-container.mode-interactive:hover .step-4,
    .logo-container.is-expanded .step-4 { transition-delay: 0.39s; }

    .logo-container.mode-interactive:hover .step-5,
    .logo-container.is-expanded .step-5 { transition-delay: 0.46s; }

    .logo-container.mode-interactive:hover .step-6,
    .logo-container.is-expanded .step-6 { transition-delay: 0.53s; }


    /* ==========================================================
       MODE INTRO / SPLASH SCREEN (@keyframes otomatis)
       ========================================================== */
    .logo-container.mode-splash {
      animation: badgeScaleIn 0.6s var(--ease-spring) forwards;
    }

    .logo-container.mode-splash .anchor-L {
      animation: kfMorphL 2.2s var(--ease-smooth) forwards;
    }

    .logo-container.mode-splash .anchor-O {
      animation: kfMorphO 2.2s var(--ease-smooth) forwards;
    }

    .logo-container.mode-splash .star-inside-O {
      animation: kfSpinStar 2.2s var(--ease-spring) forwards;
    }

    .logo-container.mode-splash .char-item {
      animation: kfPopChar 0.6s var(--ease-spring) forwards;
    }

    .logo-container.mode-splash .step-1 { animation-delay: 1.10s; }
    .logo-container.mode-splash .step-2 { animation-delay: 1.18s; }
    .logo-container.mode-splash .step-3 { animation-delay: 1.26s; }
    .logo-container.mode-splash .step-4 { animation-delay: 1.34s; }
    .logo-container.mode-splash .step-5 { animation-delay: 1.42s; }
    .logo-container.mode-splash .step-6 { animation-delay: 1.50s; }

    @keyframes badgeScaleIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes kfMorphL {
      0%, 38% { transform: translate(-1px, 11px) scale(3.01, 3.01); }
      75%, 100% { transform: translate(0, 0) scale(1, 1); }
    }

    @keyframes kfMorphO {
      0%, 38% { transform: translate(89.908px, -85px) scale(2.002, 2.002); }
      75%, 100% { transform: translate(0, 0) scale(1, 1); }
    }

    @keyframes kfSpinStar {
      0%, 38% { transform: rotate(0deg); }
      75%, 100% { transform: rotate(180deg); }
    }

    @keyframes kfPopChar {
      0% { opacity: 0; transform: translateY(14px) scale(0.55); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="btn-interactive" class="active" onclick="setAnimationMode('interactive')">
      Mode Interaktif (Hover / Klik)
    </button>
    <button id="btn-splash" onclick="setAnimationMode('splash')">
      Putar Intro / Splash Screen
    </button>
  </div>

  <p class="caption" id="caption-text">
    Arahkan kursor (hover) atau klik logo untuk mengubah <b>Full-Icon</b> menjadi <b>Full-Logo</b>.

      </g>

    </svg>
  </div>

  <script>
    const logoWidget = document.getElementById('logoWidget');
    const btnInteractive = document.getElementById('btn-interactive');
    const btnSplash = document.getElementById('btn-splash');
    const captionText = document.getElementById('caption-text');

    function setAnimationMode(mode) {
      logoWidget.classList.remove('mode-interactive', 'mode-splash', 'is-expanded');
      void logoWidget.offsetWidth; // Restart CSS animation

      if (mode === 'interactive') {
        logoWidget.classList.add('mode-interactive');
        btnInteractive.classList.add('active');
        btnSplash.classList.remove('active');
        captionText.innerHTML = 'Arahkan kursor (hover) atau klik logo untuk mengubah <b>Full-Icon</b> menjadi <b>Full-Logo</b>.';
      } else {
        logoWidget.classList.add('mode-splash');
        btnSplash.classList.add('active');
        btnInteractive.classList.remove('active');
        captionText.innerHTML = 'Memutar animasi <b>Intro / Splash Screen</b> dari Full-Icon ke Full-Logo...';
      }
    }

    function toggleClickedState() {
      if (logoWidget.classList.contains('mode-interactive')) {
        logoWidget.classList.toggle('is-expanded');
      }
    }
  </script>
</body>
</html>
